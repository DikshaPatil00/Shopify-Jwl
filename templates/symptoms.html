<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Symptoms</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container symptom-form"> 

<form method="POST">

<h2>Enter Your Symptoms</h2><br>

<div class="input-group">
    
<label>Primary Symptom</label>
<select name="symptoms" required>
    <option value="" selected disabled>Select</option>
    <option value="Fever">Fever</option>
    <option value="Cough">Cough</option>
    <option value="Headache">Headache</option>
    <option value="Weakness">Weakness</option>
    <option value="Chest pain">Chest pain</option>
    <option value="Breathlessness">Breathlessness</option>
</select>
</div>

<div class="input-group">
<label>Temperature (°C)</label><br>
<input type="number" step="0.1" name="temperature" required>
</div>

<div class="input-group">
<label>Duration</label><br>
<select name="duration">
    <option value="1-2 days">1–2 days</option>
    <option value="3-5 days">3–5 days</option>
    <option value="More than 5 days">More than 5 days</option>
</select>
</div>

<div class="input-group">
<label>Severity</label><br>
<select name="severity">
    <option value="Mild">Mild</option>
    <option value="Moderate">Moderate</option>
    <option value="High">High</option>
</select>
</div>

<button type="submit" class="btn-primary">Submit</button>

</form>
</div>
</body>
</html>
